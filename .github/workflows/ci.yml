
name: Python CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  python-validation:
    name: Python 3.11 Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python version
        run: python --version

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -c "from pathlib import Path; files = [p for d in ('backend', 'tests', 'scripts') if Path(d).exists() for p in Path(d).rglob('*.py')]; [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'Validated {len(files)} Python file(s).')"
